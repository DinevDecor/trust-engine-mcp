[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-engine-mcp"
version = "0.2.2"
description = "Free MCP server for AI agents: model retirement dates with sources, public cost-vs-quality benchmark, local usage-cost analysis and a free pilot request."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Trust Engine AI", email = "hello@agenttrustapi.com" }]
keywords = ["mcp", "llm", "model-deprecation", "model-retirement", "llm-cost", "ai-agents", "evals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.9,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://agenttrustapi.com"
Source = "https://github.com/DinevDecor/trust-engine-mcp"
"Retirement calendar" = "https://agenttrustapi.com/retirements/"
"For LLM agents" = "https://agenttrustapi.com/llms.txt"

[project.scripts]
trust-engine-mcp = "trust_engine_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trust_engine_mcp = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
